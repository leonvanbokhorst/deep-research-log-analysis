<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
      .bg{fill:#fbfbfa}.ink{fill:#0b1833}.muted{fill:#657083}.navy{fill:#0e5ab7}.orange{fill:#f47b20}.green{fill:#28a65a}.red{fill:#df3946}
      .card{fill:#fff;stroke:#d9dfe8;stroke-width:2}.softblue{fill:#eef5ff}.softorange{fill:#fff3e8}.softgreen{fill:#edf9f1}.softred{fill:#fff0f1}
      .t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#0b1833}.h{font-weight:700}.small{font-size:22px}.body{font-size:26px}.big{font-size:34px}.title{font-size:48px;font-weight:750}
      .line{stroke:#7b8797;stroke-width:2;fill:none}.thin{stroke:#aeb8c6;stroke-width:1.6;fill:none}
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#59677a"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1440" height="900"/>
  <text class="t title" x="70" y="80">The economics of cache-enabled scale</text>
  
  <text class="t body" x="75" y="130">Observed DeepSeek billing for the frozen research run · 25 September 2026</text>

  <rect x="70" y="175" width="620" height="610" rx="24" class="card"/>
  <text class="t big h" x="110" y="230">Token composition</text>
  <text class="t body" x="110" y="270">1.286B logged tokens</text>
  <rect x="120" y="340" width="500" height="82" rx="12" class="softblue"/>
  <rect x="120" y="455" width="500" height="82" rx="12" class="softorange"/>
  <rect x="120" y="570" width="500" height="82" rx="12" class="softgreen"/>
  <text class="t big h" x="155" y="392">1.258B</text><text class="t body" x="360" y="392">cache reads · 97.81% of all tokens</text>
  <text class="t big h" x="155" y="507">18.8M</text><text class="t body" x="360" y="507">fresh / cache-miss input</text>
  <text class="t big h" x="155" y="622">9.31M</text><text class="t body" x="360" y="622">output</text>
  <text class="t small" x="120" y="710">Prompt-side input cache-hit rate: <tspan font-weight="700">98.525%</tspan></text>

  <rect x="750" y="175" width="620" height="610" rx="24" class="card"/>
  <text class="t big h" x="790" y="230">Actual provider cost</text>
  <text class="t title" x="790" y="310">$12.19</text>
  <text class="t body" x="1015" y="305">for the frozen run</text>
  <rect x="800" y="365" width="160" height="255" rx="16" class="softblue"/><text class="t big h" x="835" y="420">$3.78</text><text class="t small" x="825" y="462">cached input</text><text class="t small" x="830" y="500">$0.003/M</text>
  <rect x="980" y="365" width="160" height="255" rx="16" class="softorange"/><text class="t big h" x="1015" y="420">$2.83</text><text class="t small" x="1000" y="462">fresh input</text><text class="t small" x="1010" y="500">$0.15/M</text>
  <rect x="1160" y="365" width="160" height="255" rx="16" class="softgreen"/><text class="t big h" x="1195" y="420">$5.59</text><text class="t small" x="1190" y="462">output</text><text class="t small" x="1195" y="500">$0.60/M</text>
  <rect x="800" y="665" width="520" height="78" rx="14" class="softblue"/>
  <text class="t body h" x="830" y="710">Cheap scale changed feasibility, not epistemic value.</text>

</svg>